<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog Post Title</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      max-width: 700px;
      margin: 2rem auto;
      padding: 0 1rem;
      background-color: #fff;
      color: #222;
      line-height: 1.6;
    }
    header {
      border-bottom: 1px solid #ddd;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
    }
    header h1 {
      font-size: 2.2rem;
      margin: 0;
    }
    header time {
      color: #666;
      font-size: 0.9rem;
    }
    article {
      margin-bottom: 3rem;
    }
    a {
      color: #0366d6;
      text-decoration: none;
    }
    a:hover,
    a:focus {
      text-decoration: underline;
    }
    footer {
      text-align: center;
      color: #999;
      font-size: 0.9rem;
      border-top: 1px solid #ddd;
      padding-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Blog Post Title</h1>
    <time datetime="2025-08-03">August 3, 2025</time>
  </header>

  <article>
    <p>Welcome</p>

  </article>

  <footer>
    <a href="http://superuser4.github.io/blogs/index.html">&larr; Back to Blog Home</a>

</html>
