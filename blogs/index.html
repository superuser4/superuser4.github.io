<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Blog Landing Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      max-width: 700px;
      margin: 2rem auto;
      padding: 0 1rem;
      background-color: #fefefe;
      color: #333;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 {
      font-weight: 700;
      font-size: 2.5rem;
      margin-bottom: 0.3rem;
    }
    nav {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    nav a {
      text-decoration: none;
      color: #0366d6;
      font-size: 1.1rem;
      padding: 0.5rem 1rem;
      border: 1px solid #0366d6;
      border-radius: 4px;
      transition: background-color 0.3s ease, color 0.3s ease;
      max-width: fit-content;
    }
    nav a:hover,
    nav a:focus {
      background-color: #0366d6;
      color: white;
      outline: none;
    }
    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Blog</h1>
    <p>Explore my posts below</p>
  </header>

  <nav>
    <a href="https://superuser4.github.io/blogs/why_i_wrote_malloc.html">Why I wrote a mini malloc for learning and I recommend you do the same</a>
  </nav>

</body>
</html>
