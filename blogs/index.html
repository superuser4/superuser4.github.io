<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Blog Landing Page</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
      Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    max-width: 700px;
    margin: 2rem auto;
    padding: 0 1rem;
    background-color: #121212;
    color: #e0e0e0;
    line-height: 1.6;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
    border-bottom: 1px solid #333;
    padding-bottom: 1rem;
  }

  header h1 {
    font-size: 2.5rem;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 0.3rem;
  }

  header time {
    color: #aaa;
    font-size: 0.9rem;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  nav a, footer a {
    color: #80b3ff;
    text-decoration: none;
    border: 1px solid #80b3ff;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    max-width: fit-content;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  nav a:hover, footer a:hover,
  nav a:focus, footer a:focus {
    background-color: #80b3ff;
    color: #121212;
    outline: none;
  }

  h2 {
    color: #ffffff;
  }

  ul {
    padding-left: 1.5rem;
  }

  li {
    margin-bottom: 0.5rem;
  }

  footer {
    margin-top: 3rem;
    text-align: center;
    font-size: 0.9rem;
    color: #888;
    border-top: 1px solid #333;
    padding-top: 1rem;
  }
</style>

  </head>
<body>
  <header>
    <h1>Welcome to My Blog</h1>
    <p>Explore my posts below</p>
  </header>

  <nav>
    <a href="https://superuser4.github.io/blogs/why_i_wrote_malloc.html">Why I wrote a mini malloc for learning and I recommend you do the same</a>
  </nav>

</body>
</html>
